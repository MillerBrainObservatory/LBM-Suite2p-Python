[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lbm-suite2p-python"
description = "Light Beads Microscopy Pipeline using Suite2p"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10, <=3.12"
dependencies = [
    "dask>=2025.3.0",
    "mkl-fft>=1.3.13",
    "suite2p[all]>=0.14.4",
    "tifffile>=2025.3.30",
    "zarr>=2.18.3",
    "fastplotlib @ git+https://github.com/fastplotlib/fastplotlib#egg=main",
]
[project.urls]
homepage = "https://github.com/MillerBrainObservatory/LBM-Suite2p-Python"

[project.scripts]
lsp = "lbm_suite2p_python:main"

[dependency-groups]
dev = [
    "docutils>=0.21.2",
    "myst-nb>=1.2.0",
    "sphinx>=8.1.3",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "pytest>=7.4.4",
    "ruff>=0.6.1",
]

# https://github.com/charliermarsh/ruff
[tool.ruff]
line-length = 88
src = ["lbm_suite2p_python"]
exclude = ["docs", "exclude", "demos", "scripts"] 

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = ["ALL"]
ignore = [
    "D401",   # First line should be in imperative mood (remove to opt in)
    "COM812", # Missing trailing comma (conflicts with ruff format)
    "ISC001", # Import sorting (conflicts with ruff format)
    "FIX002", # Fixable issue
    "DOC201", # TODO(manzt) enable in follow-up PR; no doc for return type.
    "FBT",    # TODO(manzt): enable in follow-up PR; require bool options to be keyword-only.
]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["D"] 

