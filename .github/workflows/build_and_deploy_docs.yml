name: Build and Deploy Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y --allow-releaseinfo-change -qq
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libegl1-mesa \
            libgl1-mesa-dri \
            libxcb-xfixes0-dev \
            mesa-vulkan-drivers \
            git-lfs \
            libglvnd-dev \
            python3-pip

      - name: Patch conf.py to bypass suite2p import
        run: sed -i '/from lbm_suite2p_python import __version__/ s/^/#/' docs/conf.py

      - name: Build Docs
        working-directory: docs
        run: make html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: docs/_build/html
